const nearbyRoot=document.querySelector('#nearbyCards');document.querySelector('#nearbySub').textContent=`以住宿「${stayData.address}」為中心，步行時間為概估`;nearbyRoot.innerHTML=stayData.nearby.map(p=>`<article class="card nearby-card"><div class="nearby-meta"><span class="tag">${p.type}</span><span class="nearby-time">🚶 ${p.walk}</span></div><h3>${p.jp}<br><span style="font-size:14px;color:var(--muted)">${p.zh}</span></h3><p>${p.note}</p><a class="maplink" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.jp+' '+stayData.address)}" target="_blank" rel="noopener">Google 地圖 ↗</a></article>`).join('');

const tabs=document.querySelector('#dateTabs'),panel=document.querySelector('#dayPanel');function renderDay(i){const d=days[i];panel.innerHTML=`<div class="daytitle"><div><h3>${d.date}（${d.dow}）｜${d.title}</h3><p>${d.mood}</p></div>${d.must?'<span class="badge">✦ 必去</span>':''}</div><div class="timeline">${d.events.map(e=>`<article class="event"><div class="eventtop"><time>${e[0]}</time><span class="transport">${e[3]}</span></div><h4>${e[1]}</h4><p>${e[2]}</p></article>`).join('')}</div>`;tabs.querySelectorAll('button').forEach((b,j)=>{b.classList.toggle('active',j===i);b.setAttribute('aria-selected',j===i?'true':'false')})}tabs.innerHTML=days.map((d,i)=>`<button class="datebtn${i===0?' active':''}" role="tab" aria-selected="${i===0}" aria-controls="dayPanel" data-day="${i}"><span>週${d.dow}</span><span>${d.date.slice(2)}</span></button>`).join('');tabs.addEventListener('click',e=>{const b=e.target.closest('button[data-day]');if(b)renderDay(+b.dataset.day)});renderDay(0);
const key='tokyo2027-todos';let checked={};try{checked=JSON.parse(localStorage.getItem(key)||'{}')}catch{}const list=document.querySelector('#todoList');list.innerHTML=todos.map((t,i)=>`<label class="todo"><input type="checkbox" data-i="${i}" ${checked[i]?'checked':''}><span>${t}</span></label>`).join('');function updateProgress(){const n=Object.values(checked).filter(Boolean).length;document.querySelector('#progress').textContent=`已完成 ${n} / ${todos.length} 項`};list.addEventListener('change',e=>{if(e.target.matches('input')){checked[e.target.dataset.i]=e.target.checked;localStorage.setItem(key,JSON.stringify(checked));updateProgress()}});updateProgress();
function tick(){const target=new Date('2027-01-21T16:30:00+08:00').getTime(),diff=target-Date.now(),el=document.querySelector('#countdown');if(diff<=0){el.textContent='出發日到了！';return}const daysLeft=Math.floor(diff/86400000),hours=Math.floor(diff%86400000/3600000);el.textContent=`還有 ${daysLeft} 天 ${hours} 小時`};tick();setInterval(tick,60000);
